name: Build EtherTV server plugin

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.java'
      - '**/*.kt'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-server.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build EtherTV
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build plugin
        run: gradle --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: EtherTV-Paper-JAR
          path: build/libs/*.jar

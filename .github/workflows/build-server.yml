name: Build EtherTV Paper plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'EtherTV-1.3.0-CustomDiscs-Integrated-CLEAN.zip'
      - '.github/workflows/build-server.yml'

permissions:
  contents: read

jobs:
  build:
    name: Compile Paper plugin (Java 25)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check source archive
        run: |
          ARCHIVE="EtherTV-1.3.0-CustomDiscs-Integrated-CLEAN.zip"
          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: Source ZIP not found in repository root."
            exit 1
          fi

      - name: Extract project ZIP
        run: |
          mkdir -p project-src
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path("EtherTV-1.3.0-CustomDiscs-Integrated-CLEAN.zip")
          destination = Path("project-src").resolve()

          with ZipFile(archive) as zf:
              for item in zf.infolist():
                  target = (destination / item.filename).resolve()
                  if target != destination and destination not in target.parents:
                      raise SystemExit(f"Unsafe ZIP entry: {item.filename}")
              zf.extractall(destination)
          PY

          test -f project-src/build.gradle.kts
          test -f project-src/settings.gradle.kts
          test -d project-src/src/main/java
          test -f project-src/libs/CustomDiscs-2.7.0.jar

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build server plugin
        working-directory: project-src
        run: gradle --no-daemon clean build

      - name: Upload server JAR
        uses: actions/upload-artifact@v4
        with:
          name: EtherTV-Paper-JAR
          path: |
            project-src/build/libs/*.jar
            !project-src/build/libs/*-sources.jar
            !project-src/build/libs/*-javadoc.jar
          if-no-files-found: error
          retention-days: 14
